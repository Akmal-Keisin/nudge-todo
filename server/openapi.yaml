openapi: 3.1.0
info:
  title: Nudge API
  description: |
    Single-user todo sync for the Nudge clients. The server is the source of
    truth; clients cache the list so the nudge works offline.

    Conventions:
    - JSON, UTF-8. Field names are camelCase.
    - Timestamps are RFC 3339 in UTC, microsecond precision.
    - Ids are UUIDs generated by the client, so retries and undo are safe.
    - Every endpoint except `/health` requires `Authorization: Bearer <token>`.
  version: 1.0.0
servers:
  - url: https://<host>/api/v1
    description: Production (base path included here; paths below are relative)

paths:
  /health:
    get:
      operationId: health
      summary: Liveness check
      security: []
      responses:
        '200':
          description: The service is up.

  /todos:
    get:
      operationId: listTodos
      summary: List todos
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, archived, all]
            default: all
          description: |
            Active is sorted by createdAt descending, archived by archivedAt
            descending.
      responses:
        '200':
          description: The list. Expired archived todos are filtered out.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTodo
      summary: Create a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                id:
                  type: string
                  format: uuid
                  description: Optional. The server generates one when omitted.
                text:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Todo'
        '200':
          description: |
            The id already existed; the stored todo is returned unchanged, which
            makes retries idempotent.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateTodo
      summary: Edit text and/or archive/restore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 500
                isArchived:
                  type: boolean
              minProperties: 1
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Todo'
        '400':
          description: |
            Validation failed. Also returned when changing the text of an
            archived todo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteTodo
      summary: Delete permanently
      responses:
        '204':
          description: Deleted (or already gone).
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A single shared token held in the server's `API_TOKEN` env var.

  schemas:
    Todo:
      type: object
      required: [id, text, isArchived, archivedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Trimmed.
        isArchived:
          type: boolean
        archivedAt:
          type: [string, 'null']
          format: date-time
          description: Set when isArchived becomes true, cleared when it is false.
        createdAt:
          type: string
          format: date-time
          description: Never changes.
        updatedAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - NOT_FOUND
                - RATE_LIMITED
                - INTERNAL_ERROR
            message:
              type: string
              description: For developers. The app shows its own user-facing text.
            details:
              type: object
              additionalProperties: true

  responses:
    ValidationError:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No todo with that id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests for this token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

security:
  - bearerAuth: []
